name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & validation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dependencies used by validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends desktop-file-utils

      - name: Set up Node (for index.html's embedded JS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Shell scripts parse (bash -n)
        run: |
          set -e
          for f in *.sh vm-kernel/*.sh packaging/build-deb.sh packaging/install.sh packaging/build-rpm.sh; do
            [ -f "$f" ] || continue
            echo "-- $f"
            bash -n "$f"
          done

      - name: PKGBUILD parses (it's valid bash)
        run: |
          set -e
          # makepkg itself can't run here (deeply tied to pacman), but
          # PKGBUILD is plain bash — bash -n at least catches syntax
          # errors on every push instead of only when someone runs
          # makepkg by hand.
          bash -n packaging/arch/PKGBUILD

      - name: POSIX sh scripts parse (sh -n)
        run: |
          set -e
          # piforge-server-root declares #!/bin/sh, not bash — validate it
          # with the shell it actually declares (flagged by CodeRabbit's
          # automated review; bash -n is a superset parser and can accept
          # things a real POSIX sh would reject).
          for f in packaging/piforge-server-root; do
            echo "-- $f"
            sh -n "$f"
          done

      - name: provision.example.json is valid JSON
        run: python3 -c "import json; json.load(open('provision.example.json')); print('provision.example.json OK')"

      - name: Python files parse (ast.parse)
        run: |
          python3 -c "
          import ast, sys
          files = ['server.py', 'firstrun_gen.py', 'provision.py']
          for f in files:
              ast.parse(open(f).read(), filename=f)
              print(f, 'OK')
          "

      - name: index.html embedded JS parses
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const m = html.match(/<script>([\s\S]*)<\/script>/);
          if (!m) { console.error('no <script> block found'); process.exit(1); }
          new Function(m[1]);
          console.log('index.html JS OK');
          "

      - name: index.html parses as valid markup
        run: |
          python3 -c "
          import html.parser
          class Check(html.parser.HTMLParser): pass
          Check().feed(open('index.html').read())
          print('HTML parse OK')
          "

      - name: Issue template YAML is valid
        run: |
          python3 -c "
          import yaml, glob
          for f in glob.glob('.github/ISSUE_TEMPLATE/*.yml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f, 'OK')
          "

      - name: .desktop file validates
        run: desktop-file-validate packaging/debian/piforge.desktop

      - name: polkit .policy file matches its declared contract exactly
        run: |
          python3 -c "
          import xml.dom.minidom as m
          EXPECTED_ID = 'io.github.gokul-hastrophil.piforge.run-server'
          EXPECTED_EXEC_PATH = '/opt/piforge/piforge-server-root'

          d = m.parse('packaging/debian/io.github.gokul-hastrophil.piforge.policy')
          actions = d.getElementsByTagName('action')
          assert len(actions) == 1, f'expected one action, found {len(actions)}'
          action = actions[0]
          action_id = action.getAttribute('id')
          assert action_id == EXPECTED_ID, f'action id {action_id!r} != {EXPECTED_ID!r}'

          annotations = [
              a for a in action.getElementsByTagName('annotate')
              if a.getAttribute('key') == 'org.freedesktop.policykit.exec.path'
          ]
          assert len(annotations) == 1, (
              f'expected one exec.path annotation, found {len(annotations)}'
          )
          exec_path = annotations[0].firstChild.nodeValue
          assert exec_path == EXPECTED_EXEC_PATH, f'exec.path {exec_path!r} != {EXPECTED_EXEC_PATH!r}'

          print('policy OK — action id and exec.path match exactly:', action_id, exec_path)
          "

      - name: packaging/piforge (native app) parses
        run: python3 -c "import ast; ast.parse(open('packaging/piforge').read()); print('packaging/piforge OK')"

      - name: No secrets committed
        run: |
          set -e
          if [ -f config.json ]; then echo "::error::config.json must never be committed"; exit 1; fi
          if [ -f profiles.json ]; then echo "::error::profiles.json must never be committed"; exit 1; fi
          if [ -f provision.json ]; then echo "::error::provision.json must never be committed"; exit 1; fi
          echo "OK: no real config/profiles file in the tree"

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build package
        run: ./packaging/build-deb.sh
      - name: Inspect package (no secrets, sane contents)
        run: |
          set -e
          DEB=$(ls packaging/dist/*.deb)
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep -E "config\.json$|profiles\.json$" && \
            { echo "::error::secrets present in built package"; exit 1; } || true
          echo "OK: package built cleanly, no secrets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piforge-deb
          path: packaging/dist/*.deb
          retention-days: 14

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install rpmbuild
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm
      - name: Build package
        run: ./packaging/build-rpm.sh
      - name: Inspect package (no secrets, sane contents)
        run: |
          set -e
          RPM=$(ls packaging/rpm-dist/*.rpm)
          rpm -qip "$RPM"
          rpm -qlp "$RPM" | grep -E "config\.json$|profiles\.json$" && \
            { echo "::error::secrets present in built package"; exit 1; } || true
          echo "OK: package built cleanly, no secrets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piforge-rpm
          path: packaging/rpm-dist/*.rpm
          retention-days: 14
